name: Portfolio Validation

on:
  push:
    branches: [main]
    paths:
      - "projects/commercial-operations-supply-chain-risk-analysis/analysis/**"
      - ".github/workflows/portfolio-validation.yml"
  pull_request:
    paths:
      - "projects/commercial-operations-supply-chain-risk-analysis/analysis/**"
      - ".github/workflows/portfolio-validation.yml"
  workflow_dispatch:

jobs:
  validate-weighted-scoring:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/commercial-operations-supply-chain-risk-analysis/analysis
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run portfolio regression tests
        run: python -m unittest -v
